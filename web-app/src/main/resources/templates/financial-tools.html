<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Financial · VMETRIX</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',sans-serif; background:#f5f7fa; color:#222; }
header { background:#1a1a2e; color:#fff; padding:1rem 2rem; }
header h1 { font-size:1.4rem; }
nav { background:#16213e; padding:0.5rem 2rem; display:flex; gap:1.5rem; }
nav a { color:#aac4ff; text-decoration:none; font-size:0.9rem; }
nav a:hover { color:#fff; }
main { max-width:760px; margin:2rem auto; padding:0 1rem; }
.card { background:#fff; border-radius:8px; padding:1.5rem; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:1rem; }
.card h2 { font-size:1rem; color:#1a1a2e; margin-bottom:1rem; }
.form-row { display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:0.8rem; }
.form-row label { flex:1; min-width:120px; }
.form-row label span { display:block; font-size:0.78rem; color:#666; margin-bottom:0.3rem; }
.form-row input { width:100%; padding:0.45rem; border:1px solid #ccc; border-radius:4px; font-size:0.9rem; }
button { background:#1a1a2e; color:#fff; border:none; padding:0.45rem 1.2rem; border-radius:4px; cursor:pointer; }
.result { margin-top:1rem; background:#eef2ff; border-left:4px solid #1a1a2e; padding:0.8rem 1rem; border-radius:0 4px 4px 0; }
</style></head>
<body>
<header><h1>VMETRIX Portal</h1></header>
<nav>
    <a href="/">Home</a><a href="/tools/string">String Tools</a>
    <a href="/tools/validation">Validation</a><a href="/tools/financial">Financial</a>
    <a href="/tools/statistics">Statistics</a>
</nav>
<main>
    <div class="card">
        <h2>Compound Interest</h2>
        <form method="post" action="/tools/financial/compound">
            <div class="form-row">
                <label><span>Principal</span><input type="number" step="0.01" name="principal" value="1000" required/></label>
                <label><span>Annual Rate (e.g. 0.05)</span><input type="number" step="0.001" name="rate" value="0.05" required/></label>
                <label><span>Periods/year</span><input type="number" name="periods" value="12" required/></label>
                <label><span>Years</span><input type="number" step="0.5" name="years" value="1" required/></label>
            </div>
            <button type="submit">Calculate</button>
        </form>
    </div>
    <div class="card">
        <h2>Apply Discount</h2>
        <form method="post" action="/tools/financial/discount">
            <div class="form-row">
                <label><span>Value</span><input type="number" step="0.01" name="value" value="100" required/></label>
                <label><span>Discount %</span><input type="number" step="0.1" name="percentage" value="10" required/></label>
            </div>
            <button type="submit">Apply</button>
        </form>
    </div>
    <div class="result" th:if="${result}">
        <strong th:text="${operation}"></strong>: <span th:text="${result}"></span>
    </div>
</main>
</body></html>
