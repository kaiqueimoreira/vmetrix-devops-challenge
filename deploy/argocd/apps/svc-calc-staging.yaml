# STAGING: sincronização automática. Todo commit na main que altera
# deploy/svc-calc/overlays/staging (feito pelo CI) é aplicado sem intervenção.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: svc-calc-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: svc-calc
    vmetrix/environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vmetrix
  source:
    repoURL: https://github.com/kaiqueimoreira/vmetrix-devops-challenge.git
    targetRevision: main
    path: deploy/svc-calc/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: svc-calc-staging
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
