name: gitops-set-image
description: >
  Atualiza a tag de imagem de um serviço no overlay Kustomize de um ambiente
  (deploy/<service>/overlays/<environment>) através de um PR para a main:
  cria a branch, abre o PR, roda o CI (validação dos manifests), espera ficar
  verde e faz o merge. Nada é enviado direto para a main — o ruleset vale para
  todos, inclusive para o pipeline. O ArgoCD observa a main: o merge É o deploy.

inputs:
  service:
    description: Nome do serviço (diretório em deploy/)
    required: true
  environment:
    description: staging | production
    required: true
  tag:
    description: Tag de imagem já existente no GHCR
    required: true
  reason:
    description: Texto extra para a descrição do PR
    required: false
    default: ''

outputs:
  changed:
    description: true se um PR de deploy foi mergeado
    value: ${{ steps.pr.outputs.changed }}
  pr-url:
    value: ${{ steps.pr.outputs.url }}
  previous-tag:
    value: ${{ steps.edit.outputs.previous }}

runs:
  using: composite
  steps:
    - name: Atualizar kustomization
      id: edit
      shell: bash
      env:
        FILE: deploy/${{ inputs.service }}/overlays/${{ inputs.environment }}/kustomization.yaml
        SERVICE: ${{ inputs.service }}
        TAG: ${{ inputs.tag }}
      run: |
        previous="$(yq ".images[] | select(.name == \"${SERVICE}\") | .newTag" "$FILE")"
        echo "previous=${previous}" >> "$GITHUB_OUTPUT"
        yq -i "(.images[] | select(.name == \"${SERVICE}\")).newTag = \"${TAG}\"" "$FILE"
        echo "${FILE}: ${previous} -> ${TAG}"

    - name: PR de deploy (branch -> CI -> merge)
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FILE: deploy/${{ inputs.service }}/overlays/${{ inputs.environment }}/kustomization.yaml
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        TAG: ${{ inputs.tag }}
        PREVIOUS: ${{ steps.edit.outputs.previous }}
        REASON: ${{ inputs.reason }}
      run: |
        if git diff --quiet -- "$FILE"; then
          echo "Tag ${TAG} já está em ${ENVIRONMENT}; nada a fazer."
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        prefix="gitops/${SERVICE}-${ENVIRONMENT}-"
        branch="${prefix}${TAG}"
        title="deploy(${SERVICE}/${ENVIRONMENT}): ${PREVIOUS} -> ${TAG}"
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # PRs de deploy antigos do mesmo serviço/ambiente ficaram obsoletos: fecha para não conflitar.
        gh pr list --state open --base main --json number,headRefName \
          -q ".[] | select(.headRefName | startswith(\"${prefix}\")) | select(.headRefName != \"${branch}\") | .number" |
          while read -r n; do gh pr close "$n" --delete-branch --comment "Substituído por ${branch}."; done

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git add "$FILE"
        git commit -m "$title" -m "$REASON" -m "Run: ${run_url}"
        git push --force origin "$branch"

        body="$(printf '%s\n\n%s\n\n%s\n' \
          "Deploy automático de **${SERVICE}** em **${ENVIRONMENT}**: \`${PREVIOUS}\` → \`${TAG}\`." \
          "${REASON}" \
          "Aberto pelo run ${run_url}. Após o merge o ArgoCD aplica a mudança.")"
        url="$(gh pr view "$branch" --json url -q .url 2>/dev/null || true)"
        if [[ -z "$url" ]]; then
          url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body")"
        fi
        echo "url=${url}" >> "$GITHUB_OUTPUT"
        echo "PR: ${url}"

        # Commits/PRs feitos com GITHUB_TOKEN não disparam workflows; workflow_dispatch é a exceção.
        head_sha="$(git rev-parse HEAD)"
        gh workflow run ci.yml --ref "$branch" -f compare-to=main
        run_id=""
        for _ in $(seq 1 30); do
          run_id="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
            --json databaseId,headSha -q "[.[] | select(.headSha == \"${head_sha}\")][0].databaseId")"
          [[ -n "$run_id" ]] && break
          sleep 2
        done
        if [[ -z "$run_id" ]]; then
          echo "::error::Run de CI do PR de deploy não foi encontrado."
          exit 1
        fi
        echo "Aguardando CI do PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
        if ! gh run watch "$run_id" --exit-status --interval 10 >/dev/null; then
          echo "::error::CI do PR de deploy falhou; PR ${url} mantido aberto para análise."
          exit 1
        fi

        gh pr merge "$branch" --squash --delete-branch --subject "$title"
        echo "changed=true" >> "$GITHUB_OUTPUT"
        {
          echo "### 🚢 ${title}"
          echo "PR: ${url}"
        } >> "$GITHUB_STEP_SUMMARY"
