# Pipeline reutilizável de SERVIÇO (svc-calc, svc-misc, web-app).
# resolve deps -> verify (testes de integração) -> docker build -> smoke test -> push GHCR
name: _service

on:
  workflow_call:
    inputs:
      module:
        description: Diretório/artifactId do serviço
        type: string
        required: true
      port:
        description: Porta HTTP do serviço (usada no smoke test)
        type: number
        required: true
      push:
        description: Publicar a imagem no GHCR (somente main)
        type: boolean
        default: false
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MVN: mvn -B -ntp -s ${{ github.workspace }}/.github/maven-settings.xml
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ inputs.module }}/pom.xml

      # 1. Resolução de dependências -------------------------------------------------
      - name: Baixar bibliotecas construídas nesta execução
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: lib-*
          path: ${{ runner.temp }}/run-libs

      - name: Instalar bibliotecas desta execução no repositório local
        run: ci/install-run-libs.sh "${{ runner.temp }}/run-libs"

      - name: Resolver dependências (libs internas via GitHub Packages)
        working-directory: ${{ inputs.module }}
        run: |
          $MVN dependency:resolve
          $MVN dependency:tree -Dincludes=com.vmetrix -DoutputFile=internal-deps.txt
          cat internal-deps.txt

      # 2. Compilação + testes de integração (SpringBootTest/MockMvc) ---------------
      - name: mvn verify
        working-directory: ${{ inputs.module }}
        run: $MVN verify

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.module }}
          path: ${{ inputs.module }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      # 3. Imagem Docker ---------------------------------------------------------------
      - name: Metadados da imagem
        id: meta
        working-directory: ${{ inputs.module }}
        run: |
          version="$(yq -p=xml -oy '.project.version' pom.xml)"
          owner="$(tr '[:upper:]' '[:lower:]' <<<"${GITHUB_REPOSITORY_OWNER}")"
          image="ghcr.io/${owner}/${{ inputs.module }}"
          # Tag = versão do pom + SHA curto do commit => rastreável e imutável. Nunca "latest".
          tag="${version}-${GITHUB_SHA::7}"
          # Linhas "+- com.vmetrix:calc-lib:jar:1.0.0:compile" (a raiz da árvore é o próprio serviço).
          libs="$(grep -oE -- '- com\.vmetrix:[a-z-]+:jar:[^:]+' internal-deps.txt | sed 's/^- com\.vmetrix://; s/:jar:/:/' | paste -sd, -)"
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tag=${tag}"
            echo "jar=target/${{ inputs.module }}-${version}.jar"
            echo "libs=${libs}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.module }}
          file: docker/Dockerfile
          build-args: JAR_FILE=${{ steps.meta.outputs.jar }}
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=${{ inputs.module }}
            com.vmetrix.internal-libs=${{ steps.meta.outputs.libs }}
            com.vmetrix.ci-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha,scope=${{ inputs.module }}
          cache-to: type=gha,mode=max,scope=${{ inputs.module }}

      - name: Smoke test do container
        run: |
          img="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker run -d --name smoke -p ${{ inputs.port }}:${{ inputs.port }} "$img"
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ inputs.port }}/actuator/health" | tee /tmp/health.json | grep -q '"UP"'; then
              echo "Container saudável:"; cat /tmp/health.json; echo
              docker rm -f smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "::error::Container não ficou saudável em 60s"
          docker logs smoke
          exit 1

      # 4. Publicação no registry ------------------------------------------------------
      - name: Login no GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: docker push
        if: inputs.push
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 🐳 ${{ inputs.module }}"
            echo "| imagem | libs internas | publicada |"
            echo "|---|---|---|"
            echo "| \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` | ${{ steps.meta.outputs.libs }} | ${{ inputs.push }} |"
          } >> "$GITHUB_STEP_SUMMARY"
